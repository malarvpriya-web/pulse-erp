name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  # ── Backend: migrate + test ─────────────────────────────────────────────────
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse_test_pw
          POSTGRES_DB: pulse_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      JWT_SECRET: ci-jwt-secret-minimum-32-characters-long-abc
      DATABASE_URL: postgresql://pulse:pulse_test_pw@localhost:5432/pulse_test
      # The CI postgres container refuses SSL handshakes; DATABASE_URL
      # otherwise implies forced SSL and every connection fails.
      DB_SSL: "false"
      ENCRYPTION_KEY: ci-encryption-key-exactly-32-chars!
      PORT: 5001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npm run migrate

      # tokens.js mints JWTs for userId 1-4; roles are DB-authoritative, so
      # the real-DB tests need those users to exist. Idempotent, test-only.
      - name: Seed test fixtures
        run: node scripts/seed-test-fixtures.mjs

      # ── Analytics schema-contract gates ──────────────────────────────────
      # These exist because of a defect class that shipped to production and was
      # invisible to every other check in this file: SQL that references a table
      # or column which does not exist, or filters a status value the app never
      # writes. Neither throws in a way anyone sees — the queries are wrapped in
      # try/catch or `.catch(() => [])`, so the feature just reports "no data"
      # forever, which is indistinguishable from a genuinely quiet dataset.
      #
      # Four such references were live when the Analytics module was audited
      # (2026-08-18): `po_items` and three `payroll_runs` columns that had never
      # existed, meaning four of five anomaly detectors had never once fired.
      # Unit tests were green throughout. See MODULE_FEATURE_CONNECTION_MANUAL.md
      # §111.7 and ANALYTICS_AI_REMEDIATION_REPORT.md.
      #
      # Runs BEFORE the unit tests deliberately: it is a fast static check, so a
      # bad column reference should be the first thing that goes red rather than
      # something to dig out from under a wall of downstream failures.
      #
      # Both connect through src/config/db.js, so they use DATABASE_URL here
      # exactly as the server does — no .env needed.
      - name: Schema contract — SQL references exist
        run: |
          set -o pipefail
          npm run check:sql-refs 2>&1 | tee sql-refs.log
      - name: Annotate missing references
        if: failure()
        run: |
          grep -E "MISSING (TABLE|COLUMN)" sql-refs.log | head -30 | while IFS= read -r l; do
            echo "::error::${l}"
          done

      # Data-dependent: it can only fail on a status value the seeded database
      # actually contains, so on a near-empty CI database it is a weak signal
      # locally-strong check. Kept as a hard gate anyway — a failure here is
      # never a false positive, it means some query is silently skipping rows.
      - name: Schema contract — status vocabulary covers the data
        run: |
          set -o pipefail
          npm run check:statuses 2>&1 | tee status-vocab.log
      - name: Annotate status drift
        if: failure()
        run: |
          grep -E "DRIFT|FAIL" status-vocab.log | head -30 | while IFS= read -r l; do
            echo "::error::${l}"
          done

      # RUNTIME gate. The two static checks above validate identifiers; their own
      # source states the limit — SELECT-side unqualified columns are unchecked.
      # Nineteen statements were failing at EXECUTION on every request while both
      # of them passed: a missing unqualified column, a GROUP BY name that bound
      # to an input column, a company fragment pasted after a bare FROM, a
      # bound-but-unreferenced parameter, and an integer/uuid comparison. None of
      # those is expressible in a reference checker. This boots the real server,
      # calls every Analytics & AI GET route, and fails on any query Postgres
      # rejected — whatever the handler did with it afterwards.
      - name: Runtime contract — no analytics query rejects
        run: |
          set -o pipefail
          node scripts/audit/sql-failure-probe.mjs 2>&1 | tee sql-failures.log
        working-directory: backend
        env:
          # The probe mints a token before it can call a single route. The
          # minter defaults to superadmin@manifest.in, which exists on a
          # developer database but never on a CI one — seed-test-fixtures.mjs
          # creates admin@test.com. Without this the probe died before
          # reaching any route, and the job then failed with "could not mint a
          # token" while never running the test suite at all.
          E2E_LOGIN_EMAIL: admin@test.com
      - name: Annotate swallowed query failures
        if: failure()
        run: |
          grep -E '^>>> |^ +\[[0-9A-Z]{5}\]' backend/sql-failures.log | head -40 | while IFS= read -r l; do
            echo "::error::${l}"
          done

      # tee + annotate: job logs need auth to download, but ::error
      # annotations are readable via the public checks API — without this,
      # diagnosing a CI-only failure from a machine with no gh/docker is blind.
      - name: Run tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee vitest.log
      - name: Annotate test failures
        if: failure()
        run: |
          grep -E "FAIL |AssertionError|Error:" vitest.log | head -40 | while IFS= read -r l; do
            echo "::error::${l}"
          done

      # Ratchet, not a scan: fails only when the count RISES. Newly-added
      # approve/reject/cancel/delete routes with no authorization break the
      # build. Lower the number as routes get gated — never raise it to go green.
      # See SECURITY_AUDIT_2026-07-18.md H-2.
      - name: Authorization coverage gate
        run: node scripts/security/authz-privileged.mjs --max 76

      # Advisory: reports known CVEs without failing the build on transitive
      # dev-dependency noise. Promote to `--audit-level=high` once the current
      # backlog is triaged, otherwise it becomes noise everyone learns to ignore.
      - name: Dependency audit (advisory)
        run: npm audit --omit=dev || true
        continue-on-error: true

  # ── Frontend: lint + build ──────────────────────────────────────────────────
  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # ── Docker: build + boot the full compose stack ─────────────────────────────
  # Nothing else exercises the Dockerfiles: Render builds from source
  # (runtime: node) and Railway uses nixpacks. Without this job a broken image
  # is only discovered when someone needs the pilot/restore-rehearsal stack.
  # Booting (not just building) also validates the migration chain against a
  # fresh Postgres from inside the production image, plus nginx→backend proxy.
  docker:
    name: Docker Build & Boot
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Throwaway values for this run only — compose refuses to start without
      # them, and the server enforces JWT_SECRET length in production mode.
      - name: Generate one-off secrets
        run: |
          {
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -base64 48)"
            echo "ENCRYPTION_KEY=$(openssl rand -base64 32)"
          } >> "$GITHUB_ENV"

      # -f twice layers docker-compose.ci.yml over the base file for every
      # remaining compose command in this job (see that file for why:
      # restart:no makes a crash terminal instead of silently retried, so
      # "Logs on failure" shows exactly one attempt, not several concatenated
      # and interleaved in a way that reads as one contradictory failure).
      - name: Build images
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml build

      # --wait blocks on the HEALTHCHECKs baked into both images. Backend
      # start_period is 60s because migrations run on boot; 240s leaves room
      # for the full chain on a cold database.
      - name: Boot stack
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --wait --wait-timeout 240

      - name: Probe endpoints
        run: |
          curl -fsS http://localhost:5000/api/health
          curl -fsS -o /dev/null http://localhost:8080/

      # ── Analytics & AI end-to-end gates ─────────────────────────────────
      # Three suites, three failure classes nothing else in this file catches:
      #
      #   analytics-contract  — KPI reconciliation and honesty contracts. Two
      #     surfaces reporting different numbers for the same named KPI is a
      #     200-with-wrong-data defect; no unit test compares across endpoints.
      #
      #   tenant-isolation    — seeds a SECOND company and checks neither
      #     tenant's data reaches the other. With one company in the database
      #     every isolation claim is unfalsifiable, which is how nine unscoped
      #     queries survived a code-reading audit that filed them as "latent".
      #     They were live: /dashboard/finance carried one company's invoice
      #     into the other's receivable.
      #
      #   analytics-browser   — the eight Analytics & AI pages in a real
      #     browser: render, console/exception cleanliness, deep link, reload,
      #     tabs, filters. Every earlier check was API-level and could not see
      #     a page that throws on mount.
      #
      # These run in the docker job because it is the only one with a booted
      # stack. Until 2026-08-18 the whole suite lived OUTSIDE this repository
      # and was untracked, so none of it had ever run in CI; it now lives in
      # tests/ and is checked out with everything else.
      #
      # Blocking on purpose. If one of these is flaky, fix the flake —
      # `continue-on-error` restores exactly the blind spot they were written
      # to close.
      # The docker job had no Node runtime — it only ever shelled out to
      # `docker compose`. The e2e steps below need one.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install E2E dependencies
        run: |
          npm ci
          # The Playwright suites spawn backend/scripts/e2e-mint-token.mjs to get
          # a token. That script runs on the RUNNER, not inside the container, so
          # it needs the backend's own dependencies — dotenv, jsonwebtoken and pg,
          # all production deps. Without this the suite died on
          # ERR_MODULE_NOT_FOUND before its first assertion.
          npm ci --prefix backend --omit=dev
          npx playwright install --with-deps chromium

      - name: Analytics & AI — contract, tenant isolation, browser
        env:
          PULSE_API: http://localhost:5000/api/v1
          PULSE_API_BASE: http://localhost:5000
          PULSE_FRONT_BASE: http://localhost:8080
        run: |
          set -o pipefail
          npm run test:analytics -- --reporter=list 2>&1 | tee e2e.log

      - name: Annotate E2E failures
        if: failure()
        run: |
          grep -E "Error:|expect|failed|✘" e2e.log | head -40 | while IFS= read -r l; do
            echo "::error::${l}"
          done

      - name: Upload E2E artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-e2e-artifacts
          path: |
            test-results/
            e2e.log
          retention-days: 7

      - name: Logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color
          docker compose -f docker-compose.yml -f docker-compose.ci.yml ps -a
          # Surface ONLY the signal lines through ::error annotations — the
          # checks API annotation list is capped low enough that a raw tail
          # dump pushes the actual message/code/stack out before it's read
          # (learned the hard way: run #7 showed pg error internals but not
          # the message or file/line that would explain them).
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color backend 2>&1 \
            | grep -E "Error|error:|❌|✅|⏱|🧹|FATAL|EACCES|ENOENT|code:|message:|at async|at Object|baseline|migrations|npm error|isFreshDatabase|Running database" \
            | tail -50 \
            | while IFS= read -r l; do echo "::error::${l}"; done

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
